services:

  # ─── MongoDB — users & courses ──────────────────────────────
  mongo:
    image: mongo:7
    container_name: skillpath_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: skillpath
      MONGO_INITDB_ROOT_PASSWORD: skillpath_secret
      MONGO_INITDB_DATABASE: skillpath
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
      - ./backend/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - skillpath_net

  # ─── Redis — JWT blacklist + sessions ───────────────────────
  redis:
    image: redis:7-alpine
    container_name: skillpath_redis
    restart: unless-stopped
    command: redis-server --requirepass redis_secret --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - skillpath_net

  # ─── Node.js API ─────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillpath_api
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - '4000:4000'
    depends_on:
      - mongo
      - redis
    networks:
      - skillpath_net

volumes:
  mongo_data:
  redis_data:

networks:
  skillpath_net:
    driver: bridge
